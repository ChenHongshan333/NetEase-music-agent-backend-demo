# spring.application.name=cs-agent-service

server.port=8080

spring.datasource.url=jdbc:h2:mem:csagentdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# 必须关掉。开启时 EntityManager（以及它持有的 JDBC 连接）会被扣到整个请求结束，
# 也就是说那 2.8 秒的 LLM 调用期间连接一直被占着。于是 Hikari 的默认 10 连接
# 变成了整个服务的并发上限：压测里 concurrency=20 实测只有 ~10 个请求真正在飞，
# 吞吐 3.5 req/s、p50 是注入延迟的两倍。关掉后同样的 10 连接池跑到 6.9 req/s。
# 本服务所有接口都返回 DTO，从不把懒加载实体交给视图层，open-in-view 没有任何收益。
spring.jpa.open-in-view=false


spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8


agent.llm.base-url=https://dashscope-intl.aliyuncs.com/compatible-mode/v1
agent.llm.api-key=${DASHSCOPE_API_KEY:}
agent.llm.model=qwen-plus
agent.llm.temperature=0.3


# ===== LLM provider: dashscope | stub =====
# stub 返回固定文本，不需要 API key；dev/test profile 与压测用它。
agent.llm.provider=${AGENT_LLM_PROVIDER:dashscope}
agent.llm.stub.delay-ms=0

# ===== LLM 超时（显式配置，不吃 OkHttp 默认值）=====
agent.llm.timeout.connect-ms=2000
agent.llm.timeout.read-ms=8000
agent.llm.timeout.write-ms=2000
agent.llm.timeout.call-ms=12000

# ===== 韧性：退避重试 + 熔断（手写，未引入 resilience4j）=====
# 单次 chat 分给"调 LLM"这一阶段的总预算，含所有重试与退避
agent.resilience.request-budget-ms=25000

agent.resilience.retry.max-attempts=3
agent.resilience.retry.base-backoff-ms=200
agent.resilience.retry.max-backoff-ms=2000
# 与 agent.llm.timeout.read-ms 对齐，用于 deadline 判断
agent.resilience.retry.assumed-call-ms=8000

agent.resilience.circuit-breaker.sliding-window-size=20
agent.resilience.circuit-breaker.minimum-calls=10
agent.resilience.circuit-breaker.failure-rate-threshold=50
agent.resilience.circuit-breaker.open-duration-ms=30000
agent.resilience.circuit-breaker.half-open-permitted-calls=3

# ===== 幂等（Idempotency-Key）=====
agent.idempotency.ttl-hours=24
agent.idempotency.max-key-length=255

# ===== Actuator =====
# 白名单暴露，不用 "*"：env / configprops / beans / threaddump 会泄露配置与内部结构
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# 换成自定义的 RedisDegradedHealthIndicator。
# Boot 自带的那个会在 Redis 挂掉时把整体 health 标 DOWN，
# 于是 K8s/LB 摘掉一个其实还能正确服务的实例，把抖动放大成故障。
management.health.redis.enabled=false
