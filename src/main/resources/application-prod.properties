# ===== PROD: MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/cs_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=cs
spring.datasource.password=cs_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== PROD: Redis (for later cache) =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 必须显式设置。Lettuce 默认命令超时是 60 秒，实测下来 Redis 一挂：
#   读路径"fail open" 要 120 秒才返回（cache.get 60s + 写回 60s 各吃一次超时）
#   写路径"fail closed" 要 60 秒才返回 503
# 降级的方向是对的，但这个延迟让降级失去意义 —— 每个请求占住一个 Tomcat 线程
# 一到两分钟，200 个线程几秒钟就被打满，一次缓存故障演变成整站不可用。
# Redis 在同机/同内网，250ms 已经非常宽松：超过它基本就是"Redis 没了"。
spring.data.redis.timeout=250ms
spring.data.redis.connect-timeout=250ms

# ===== PROD: Cache TTL =====
agent.cache.ttl-seconds=600
agent.cache.refusal-ttl-seconds=30

# 明确打开prod的缓存
agent.cache.enabled=true

agent.llm.provider=dashscope
